{n:"Hàm số lượng giác và PT lượng giác",b:[
["Góc lượng giác",["Đơn vị radian: π rad = 180°. Đổi độ sang rad: nhân π/180; rad sang độ: nhân 180/π.","Độ dài cung tròn bán kính R, số đo α rad: l = R·α.","Số đo góc lượng giác (Ou, Ov) = α + k2π, k ∈ ℤ."],[["Đổi 3π/4 rad sang độ.","3π/4 · 180/π = 135°."],["Cung tròn bán kính 10 cm, số đo 1,5 rad. Tính độ dài cung.","l = 10 · 1,5 = 15 cm."]]],
["Công thức lượng giác",["sin²α + cos²α = 1; tan α = sin α/cos α; tan α·cot α = 1.","Cung liên kết: cos đối, sin bù, phụ chéo, hơn kém π thì tan và cot.","Công thức cộng: cos(a − b) = cos a cos b + sin a sin b; sin(a + b) = sin a cos b + cos a sin b.","Nhân đôi: sin 2a = 2sin a cos a; cos 2a = 2cos²a − 1 = 1 − 2sin²a."],[["Cho sin α = 3/5 và π/2 < α < π. Tính cos α, tan α.","cos²α = 1 − 9/25 = 16/25. Vì α ở góc phần tư II nên cos α = −4/5. tan α = (3/5):(−4/5) = −3/4."],["Tính cos 75°.","cos 75° = cos(45° + 30°) = cos45°cos30° − sin45°sin30° = (√6 − √2)/4."]]],
["Hàm số lượng giác",["y = sin x, y = cos x: tập xác định ℝ, tập giá trị [−1; 1], chu kỳ 2π.","y = tan x: xác định khi x ≠ π/2 + kπ; y = cot x: x ≠ kπ; chu kỳ π.","cos x là hàm chẵn; sin x, tan x, cot x là hàm lẻ.","y = sin(ax + b), y = cos(ax + b) có chu kỳ 2π/|a|."],[["Tìm chu kỳ của y = sin 2x.","T = 2π/2 = π."],["Tìm giá trị lớn nhất của y = 3 + 2cos x.","Vì cos x ≤ 1 nên y ≤ 5, đạt khi x = k2π. Vậy GTLN là 5."]]],
["Phương trình lượng giác cơ bản",["sin x = sin α ⇔ x = α + k2π hoặc x = π − α + k2π.","cos x = cos α ⇔ x = ±α + k2π.","tan x = tan α ⇔ x = α + kπ; cot x = cot α ⇔ x = α + kπ.","Với sin x = m, cos x = m cần |m| ≤ 1 thì mới có nghiệm."],[["Giải 2cos x − 1 = 0.","cos x = 1/2 = cos(π/3) ⇒ x = ±π/3 + k2π."],["Giải tan(x − π/4) = 1.","x − π/4 = π/4 + kπ ⇒ x = π/2 + kπ."]]]],

{n:"Dãy số, cấp số cộng, cấp số nhân",b:[
["Dãy số",["Dãy số là hàm số u xác định trên tập số nguyên dương, kí hiệu (uₙ).","Dãy tăng nếu uₙ₊₁ > uₙ, giảm nếu uₙ₊₁ < uₙ với mọi n.","Dãy bị chặn nếu tồn tại m, M sao cho m ≤ uₙ ≤ M với mọi n."],[["Xét tính tăng giảm của uₙ = (n + 1)/n.","uₙ = 1 + 1/n. Khi n tăng thì 1/n giảm nên dãy giảm. Dãy bị chặn: 1 < uₙ ≤ 2."]]],
["Cấp số cộng",["uₙ₊₁ = uₙ + d (d là công sai).","Số hạng tổng quát: uₙ = u₁ + (n − 1)d.","Tính chất: uₖ = (uₖ₋₁ + uₖ₊₁)/2.","Tổng n số hạng đầu: Sₙ = n(u₁ + uₙ)/2 = n[2u₁ + (n − 1)d]/2."],[["CSC có u₁ = 3, d = 4. Tính u₂₀ và S₂₀.","u₂₀ = 3 + 19·4 = 79. S₂₀ = 20(3 + 79)/2 = 820."]]],
["Cấp số nhân",["uₙ₊₁ = uₙ·q (q là công bội).","Số hạng tổng quát: uₙ = u₁·qⁿ⁻¹.","Tính chất: uₖ² = uₖ₋₁·uₖ₊₁.","Tổng: Sₙ = u₁(1 − qⁿ)/(1 − q), với q ≠ 1."],[["CSN có u₁ = 2, q = 3. Tính u₄ và S₄.","u₄ = 2·3³ = 54. S₄ = 2(1 − 81)/(1 − 3) = 80."]]]],
q:[["CSC có u₁ = 2, d = 3. u₁₀ =",["29","32","30","27"],0,"2 + 9·3 = 29"],

["Dãy nào là cấp số nhân?",["1, 3, 5, 7","2, 4, 8, 16","1, 4, 9, 16","1, 2, 4, 7"],1,"q = 2"],
["Dãy uₙ = 1/n là dãy:",["Tăng","Giảm","Hằng","Không tăng không giảm"],1,"1/(n+1) < 1/n"],

["x, 6, 12 là cấp số nhân. x =",["2","3","4","0"],1,"36 = 12x ⇒ x = 3"],
["CSN u₁ = 1, q = 2. S₅ =",["31","32","16","15"],0,"(1 − 2⁵)/(1 − 2) = 31"]]},
{n:"Mẫu số liệu ghép nhóm",b:[
["Mẫu số liệu ghép nhóm",["Số liệu chia thành các nhóm [a₁; a₂), [a₂; a₃), … kèm tần số nᵢ.","Độ dài nhóm h = aᵢ₊₁ − aᵢ; giá trị đại diện cᵢ = (aᵢ + aᵢ₊₁)/2.","Cỡ mẫu n = n₁ + n₂ + … + nₖ."],[]],
["Số đặc trưng đo xu thế trung tâm mẫu ghép nhóm",["Số trung bình: x̄ = (n₁c₁ + … + nₖcₖ)/n.","Trung vị: tìm nhóm chứa vị trí n/2, Me = uₘ + [(n/2 − C)/nₘ]·h, với C là tổng tần số các nhóm trước.","Tứ phân vị Q₁, Q₃: làm tương tự với vị trí n/4, 3n/4; Q₂ = Me.","Mốt: nhóm có tần số lớn nhất, Mo = uₘ + [(nₘ − nₘ₋₁)/((nₘ − nₘ₋₁) + (nₘ − nₘ₊₁))]·h."],[["Bảng: [0;10): 5, [10;20): 10, [20;30): 5. Tính x̄, Me, Mo.","n = 20. x̄ = (5·5 + 10·15 + 5·25)/20 = 15. Me: n/2 = 10 thuộc [10;20), C = 5 ⇒ Me = 10 + (5/10)·10 = 15. Mo = 10 + 5/(5 + 5)·10 = 15."]]]],
q:[["Giá trị đại diện của nhóm [10; 20):",["10","20","15","30"],2,"(10 + 20)/2"],

["[0;2) tần số 3, [2;4) tần số 1. x̄ =",["1,5","2","1","2,5"],0,"(3·1 + 1·3)/4"],
["Độ dài nhóm [5; 10):",["10","5","7,5","15"],1,"10 − 5 = 5"],
["Các nhóm có tần số 4, 7, 9. Cỡ mẫu n =",["9","20","16","3"],1,"4 + 7 + 9"],
["Tứ phân vị thứ hai Q₂ chính là:",["Mốt","Số trung bình","Trung vị","Q₁ + Q₃"],2,"Q₂ = Me"],
["[0;10): 3, [10;20): 4, [20;30): 3. Trung vị thuộc nhóm:",["[0;10)","[10;20)","[20;30)","Không xác định"],1,"Vị trí 5, 6 thuộc nhóm thứ hai"]]},
{n:"Quan hệ song song trong không gian",b:[
["Đường thẳng và mặt phẳng trong không gian",["Mặt phẳng được xác định bởi: 3 điểm không thẳng hàng; 1 đường thẳng và 1 điểm ngoài nó; 2 đường thẳng cắt nhau.","Tìm giao tuyến hai mặt phẳng: tìm 2 điểm chung phân biệt.","Tìm giao điểm của d và (P): tìm đường a ⊂ (P) cắt d."],[["Chóp S.ABCD đáy hình bình hành tâm O. Tìm giao tuyến của (SAC) và (SBD).","S là điểm chung thứ nhất. O = AC ∩ BD nên O cũng là điểm chung. Giao tuyến là SO."]]],
["Hai đường thẳng song song",["Hai đường thẳng có thể: trùng, cắt nhau, song song (đồng phẳng, không điểm chung), chéo nhau (không đồng phẳng).","Hai mặt phẳng cắt nhau lần lượt chứa hai đường song song thì giao tuyến song song (hoặc trùng) với hai đường đó."],[["S.ABCD đáy hình bình hành. Tìm giao tuyến của (SAD) và (SBC).","S chung, AD ∥ BC nên giao tuyến là đường thẳng qua S song song với AD."]]],
["Đường thẳng song song mặt phẳng, hai mặt phẳng song song",["a ∥ (P) nếu a ⊄ (P) và a song song với một đường nằm trong (P).","(P) ∥ (Q) nếu (P) chứa hai đường cắt nhau cùng song song với (Q).","Hình hộp có 6 mặt là hình bình hành, các mặt đối diện song song."],[]],
["Phép chiếu song song",["Bảo toàn tính thẳng hàng, tính song song và tỉ số hai đoạn thẳng cùng phương.","Trung điểm biến thành trung điểm; hình bình hành thường biến thành hình bình hành."],[]]],
q:[["Qua 1 điểm ngoài đường thẳng a có bao nhiêu đường song song với a?",["0","1","2","Vô số"],1,"Tiên đề Ơ-clít"],
["4 điểm không đồng phẳng xác định bao nhiêu mặt phẳng?",["1","3","4","6"],2,"C(4,3) = 4"],
["Hai đường không đồng phẳng gọi là:",["Song song","Cắt nhau","Chéo nhau","Trùng nhau"],2,"Định nghĩa"],
["S.ABCD đáy hình bình hành tâm O. (SAC) ∩ (SBD) =",["SA","SO","SB","AC"],1,"S và O là hai điểm chung"],
["S.ABCD đáy hình bình hành. Giao tuyến (SAD) và (SBC) song song với:",["AB","AC","AD","SC"],2,"AD ∥ BC"],
["Hình hộp có bao nhiêu mặt?",["4","5","6","8"],2,"6 mặt hình bình hành"],
["Phép chiếu song song biến trung điểm đoạn thẳng thành:",["Trung điểm","Đầu mút","Điểm bất kỳ","Không xác định"],0,"Bảo toàn tỉ số"],
["Mặt phẳng được xác định duy nhất bởi:",["3 điểm","2 đường chéo nhau","3 điểm không thẳng hàng","1 đường thẳng"],2,"Định lí xác định mặt phẳng"]]},
{n:"Giới hạn, hàm số liên tục",b:[
["Giới hạn của dãy số",["lim 1/nᵏ = 0 (k > 0); lim qⁿ = 0 khi |q| < 1.","Phân thức theo n: chia tử và mẫu cho lũy thừa cao nhất của n.","Cấp số nhân lùi vô hạn (|q| < 1): S = u₁/(1 − q)."],[["Tính lim (3n² + 1)/(n² − 2).","Chia tử và mẫu cho n²: lim (3 + 1/n²)/(1 − 2/n²) = 3."],["Tính 1 + 1/2 + 1/4 + …","CSN lùi vô hạn u₁ = 1, q = 1/2: S = 1/(1 − 1/2) = 2."]]],
["Giới hạn của hàm số",["Hàm đa thức, phân thức xác định tại x₀: thay trực tiếp x = x₀.","Dạng 0/0: phân tích nhân tử hoặc nhân liên hợp rồi rút gọn.","x → ±∞: chia cho lũy thừa cao nhất của x.","lim f(x) tồn tại ⇔ giới hạn trái bằng giới hạn phải."],[["Tính lim (x² − 1)/(x − 1) khi x → 1.","= lim (x − 1)(x + 1)/(x − 1) = lim (x + 1) = 2."],["Tính lim (2x + 1)/(x − 3) khi x → +∞.","Chia cho x: (2 + 1/x)/(1 − 3/x) → 2."]]],
["Hàm số liên tục",["f liên tục tại x₀ ⇔ lim f(x) (x → x₀) = f(x₀).","Đa thức, phân thức, hàm lượng giác liên tục trên từng khoảng xác định.","Nếu f liên tục trên [a; b] và f(a)·f(b) < 0 thì PT f(x) = 0 có nghiệm trong (a; b)."],[["Chứng minh x³ + x − 1 = 0 có nghiệm trong (0; 1).","f(x) = x³ + x − 1 liên tục trên ℝ; f(0) = −1, f(1) = 1, f(0)f(1) < 0 nên có nghiệm trong (0; 1)."]]]],
q:[["lim (2n + 1)/(n + 3) =",["1/3","2","1","+∞"],1,"Chia cho n: 2/1"],
["lim (x² − 4)/(x − 2), x → 2:",["0","2","4","Không tồn tại"],2,"= lim (x + 2) = 4"],
["lim (1/2)ⁿ =",["1/2","1","0","+∞"],2,"|q| < 1"],
["1 + 1/2 + 1/4 + … =",["1","2","3/2","+∞"],1,"1/(1 − 1/2) = 2"],
["lim (n² + 1)/(2n²) =",["1","0","1/2","2"],2,"Tỉ số hệ số cao nhất"],
["lim (3x − 1)/(x + 2), x → +∞:",["3","−1/2","1","+∞"],0,"Chia cho x"],

{n:"Hàm số mũ và logarit",b:[

["Phép tính logarit",["logₐb = c ⇔ aᶜ = b (0 < a ≠ 1, b > 0).","logₐ(bc) = logₐb + logₐc; logₐ(b/c) = logₐb − logₐc; logₐbⁿ = n·logₐb.","Đổi cơ số: logₐb = log꜀b/log꜀a. lg x = log₁₀x, ln x = logₑx."],[["Tính log₃81 và log₂12 − log₂3.","log₃81 = 4 vì 3⁴ = 81. log₂12 − log₂3 = log₂4 = 2."]]],
["Hàm số mũ và hàm số logarit",["y = aˣ: tập xác định ℝ, giá trị dương. y = logₐx: xác định khi x > 0.","a > 1: hàm đồng biến; 0 < a < 1: hàm nghịch biến."],[]],
["Phương trình bất phương trình mũ và logarit",["aˣ = b (b > 0) ⇔ x = logₐb. logₐx = b ⇔ x = aᵇ.","Bất phương trình: a > 1 giữ nguyên chiều; 0 < a < 1 đổi chiều.","Với logarit phải đặt điều kiện biểu thức trong log dương."],[["Giải 3^(x − 1) = 27.","27 = 3³ ⇒ x − 1 = 3 ⇒ x = 4."],["Giải log₂(x + 1) = 3.","Điều kiện x > −1. x + 1 = 2³ = 8 ⇒ x = 7 (thỏa)."],["Giải (1/2)ˣ > 4.","4 = (1/2)⁻². Cơ số 1/2 < 1 nên đổi chiều: x < −2."]]]],

function les(i){const c=C[i];m.innerHTML=`<button onclick="home0()">← Danh sách</button><h3>Chương ${i+1}. ${c.n}</h3>`+c.b.map((b,k)=>`<div class="cd"><div style="font-weight:500;margin-bottom:6px">Bài ${k+1}. ${b[0]}</div>${b[1].map(x=>`<div class="lt">• ${x}</div>`).join("")}${b[2].map(v=>`<div class="vd"><div><b style="font-weight:500">Ví dụ.</b> ${v[0]}</div><button style="margin-top:6px;font-size:13px" onclick="const s=this.nextElementSibling;s.hidden=!s.hidden;this.textContent=s.hidden?'Xem lời giải':'Ẩn lời giải'">Xem lời giải</button><div hidden style="margin-top:6px;color:var(--tsu)">${v[1]}</div></div>`).join("")}${vids(b[0])}</div>`).join("")+`<button style="width:100%" onclick="go(1);quiz(${i})">Làm bài kiểm tra chương này</button>`;scrollTo(0,0)}
function home1(){m.innerHTML=`<p class="sm">Chọn chương để kiểm tra, chấm điểm thang 10.</p>`+C.map((c,i)=>`<div class="cd" onclick="quiz(${i})" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${i+1}. ${c.n} <span class="sm">(${c.q.length} câu)</span></span><span class="sm">${S[i]!=null?S[i]+"đ":""}</span></div>`).join("")}
function quiz(i){run(sh(C[i].q.slice()),"Kiểm tra chương "+(i+1),i,0)}
function sh(p){for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p}
function run(qs,title,key,sec){let A=new Array(qs.length).fill(-1),done=false;

qs.forEach((q,k)=>q[1].forEach((o,j)=>{document.getElementById(`o${k}_${j}`).onclick=()=>{if(done)return;A[k]=j;document.getElementById("er").textContent="";q[1].forEach((_,x)=>document.getElementById(`o${k}_${x}`).classList.toggle("on",x==j))}}));
const fin=f=>{if(done)return;if(!f&&A.includes(-1)){document.getElementById("er").textContent="Còn câu "+(A.indexOf(-1)+1)+" chưa trả lời. Hãy chọn đáp án trước khi nộp.";return}done=true;clearInterval(tm);let r=0;qs.forEach((q,k)=>{if(A[k]==q[2])r++;q[1].forEach((_,x)=>{const b=document.getElementById(`o${k}_${x}`);b.classList.remove("on");if(x==q[2])b.classList.add("ok");else if(x==A[k])b.classList.add("no")});document.getElementById("g"+k).textContent="Lời giải: "+q[3]});const d=Math.round(r/qs.length*100)/10;if(key!=null){S[key]=d;save()}const xl=d>=8?"Giỏi":d>=6.5?"Khá":d>=5?"Trung bình":"Cần ôn lại";document.getElementById("rs").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="mt"><div class="sm">Điểm</div><div style="font-size:24px;font-weight:500">${d.toFixed(1)}</div></div><div class="mt"><div class="sm">Đúng</div><div style="font-size:24px;font-weight:500">${r}/${qs.length}</div></div></div><p class="sm" style="text-align:center">Xếp loại: ${xl}</p>`;document.getElementById("sb").textContent="Đã nộp";document.getElementById("rs").scrollIntoView({behavior:"smooth"})};
document.getElementById("sb").onclick=()=>fin(false);
if(sec){let t=sec;const tk=document.getElementById("tk");const up=()=>{tk.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0")};up();tm=setInterval(()=>{t--;up();if(t<=0)fin(true)},1000)}scrollTo(0,0)}
function pick(ch,n){let p=[];ch.forEach(i=>C[i].q.forEach(q=>p.push(q)));return sh(p).slice(0,n)}
const E=[["Đề giữa học kì 1","Chương 1, 2",[0,1],12,20],["Đề cuối học kì 1","Chương 1–4",[0,1,2,3],20,35],["Đề giữa học kì 2","Chương 5, 6",[4,5],12,20],["Đề cuối học kì 2","Chương 5–9",[4,5,6,7,8],25,45],["Đề tổng hợp cả năm","Toàn bộ 9 chương",[0,1,2,3,4,5,6,7,8],30,60]];
function home2(){m.innerHTML=`<p class="sm">Mỗi lần làm, câu hỏi được trộn ngẫu nhiên thành đề mới. Hết giờ sẽ tự nộp bài.</p>`+E.map((e,i)=>`<div class="cd"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><div style="font-weight:500">${e[0]}</div><div class="sm">${e[1]} · ${e[3]} câu · ${e[4]} phút</div></div><button onclick="run(pick(E[${i}][2],E[${i}][3]),E[${i}][0],'e${i}',E[${i}][4]*60)">Làm bài</button></div>${S["e"+i]!=null?`<div class="sm">Điểm gần nhất: ${S["e"+i]}</div>`:""}</div>`).join("")}
function form(){m.innerHTML=F.map(f=>`<div class="cd"><div style="font-weight:500;margin-bottom:4px">${f[0]}</div>${f[1].map(x=>`<div class="fm">${x}</div>`).join("")}</div>`).join("")}
go(0);
